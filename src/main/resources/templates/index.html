<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">あいさつメッセージ生成</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="page">
    <h1 th:text="${title}">あいさつメッセージ生成</h1>
    <p class="lead">名前を登録し、バッチを実行すると「こんにちは、○○さん！」が作られます。</p>

    <section class="panel">
        <form id="register-form" class="register-form">
            <label for="name">名前</label>
            <input id="name" name="name" type="text" autocomplete="name" placeholder="例: 田中">
            <button id="register-button" type="submit">登録</button>
        </form>
        <div class="actions">
            <button id="batch-button" type="button">バッチ実行</button>
            <button id="reload-button" type="button">一覧更新</button>
        </div>
        <p id="feedback" class="feedback" role="status"></p>
    </section>

    <section class="panel">
        <h2>登録一覧</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>名前</th>
                    <th>状態</th>
                    <th>メッセージ</th>
                    <th>登録日時</th>
                    <th>処理日時</th>
                </tr>
                </thead>
                <tbody id="greeting-list"></tbody>
            </table>
        </div>
        <p class="note">日時は日本時間（Asia/Tokyo）です。H2のインメモリDBのため、アプリを再起動するとデータは消えます。</p>
    </section>
</main>
<script src="/js/app.js" defer></script>
</body>
</html>
