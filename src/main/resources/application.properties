spring.application.name=greeting

# H2のインメモリDB。アプリを止めるとデータは消える
spring.datasource.url=jdbc:h2:mem:greeting;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 業務テーブル（greetings）を起動時に作り、終了時に捨てる
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Spring Batchのメタデータテーブル（BATCH_*）を起動時に作る
spring.batch.jdbc.initialize-schema=always
# アプリ起動時にJobを自動実行しない。実行は画面かAPIから行う
spring.batch.job.enabled=false

# エラー応答にスタックトレースや内部メッセージを含めない
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
spring.mvc.problemdetails.enabled=false
